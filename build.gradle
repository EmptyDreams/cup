import org.jreleaser.gradle.plugin.tasks.AbstractJReleaserTask

import javax.inject.Inject

// Gradle 9 removed Project.exec/javaexec; tasks that shell out use
// injected ExecOperations instead.
abstract class ExecutingTask extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOps()

    /**
     * Generated-output stability net: byte-compare every generated .java in
     * {@code genDir} against its committed golden copy under {@code goldenDir}.
     * Both sides are CRLF->LF normalized first (the emitter mixes line endings),
     * so "byte-stable" means stable after that fixed normalization. Golden files
     * must exist for every generated file (and vice versa) except names listed
     * in {@code excludes} (hand-written scanners, jflex lexers).
     *
     * @return failure descriptions; empty list means pass.
     */
    protected List<String> diffGoldenNet(String genDir, String goldenDir, String... excludes) {
        def excl = excludes as Set
        def failures = []
        def norm = { File f -> f.text.replaceAll('\r\n', '\n') }
        def goldenNames = project.fileTree(dir: goldenDir, include: '*.java')
                .collect { it.name }.sort()
        goldenNames.each { name ->
            if (excl.contains(name)) return
            def generated = new File(genDir, name)
            if (!generated.exists()) {
                failures.add("${genDir}/${name} was not generated (golden exists under ${goldenDir})")
            } else if (norm(generated) != norm(new File(goldenDir, name))) {
                failures.add("${genDir}/${name} differs from golden ${goldenDir}/${name}")
            }
        }
        project.fileTree(dir: genDir, include: '*.java').each { f ->
            if (!excl.contains(f.name) && !goldenNames.contains(f.name)) {
                failures.add("${genDir}/${f.name} was generated but has no golden under ${goldenDir}")
            }
        }
        return failures
    }
}

plugins {
    id 'java'
    id 'maven-publish'
    id 'org.jreleaser' version '1.25.0'
}

group = 'top.kmar.cup'
version = '1.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

// The project contains legacy Javadoc which is rejected as an error by newer
// JDK doclint implementations. Keep producing the required Javadoc artifact
// while the documentation is migrated to modern HTML/Javadoc syntax.
tasks.named('javadoc', Javadoc) {
    failOnError = false
    options.addBooleanOption('Xdoclint:none', true)
    options.encoding = 'UTF-8'
}

// build/generated is part of main's source set, so Gradle 9 requires the
// source archive to explicitly follow compilation.
tasks.named('sourcesJar') {
    dependsOn tasks.named('compileJava')
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

configurations {
    jflex
    cup
}

dependencies {
    jflex 'de.jflex:jflex:1.9.1'
    // Self-hosting loop: the generator that regenerates CUP's own parser.
    // Currently a committed local jar; once a Maven release with a working
    // -ast mode is published, swap this for the coordinate (e.g.
    // 'top.kmar.cup:java-cup:<version>') and delete the jar.
    cup files('bin/java-cup-bootstrap.jar')
}

sourceSets {
    main {
        java {
            // Bootstrap sources (CupParser/GrammarSymConstants/Lexer) are
            // committed here; `generateCupParser` regenerates them into
            // build/generated and byte-compares (see below). A fresh clone
            // compiles with no prerequisite generation step.
            srcDirs = ['src/main/java', 'src/generated']
        }
    }
}

compileJava {
    options.compilerArgs << '-parameters'
}

tasks.register('generateCupParser', ExecutingTask) {
    dependsOn tasks.named('generateJFlexLexer')

    doLast {
        // Regenerate CUP's own parser with the bootstrap generator declared in
        // the `cup` configuration (self-hosting loop). -ast Node%p makes the
        // spec-tree node classes (NodeSpec and friends) generated too.
        execOps.exec {
            commandLine 'java', '-cp', configurations.cup.asPath, 'java_cup.Main',
                        '-parser', 'CupParser',
                        '-symbols', 'GrammarSymConstants',
                        '-interface',
                        '-nonterms',
                        '-ast', 'Node%p',
                        '-destdir', 'build/generated/java_cup',
                        'src/cup/parser.cup'
            workingDir '.'
        }

        // The committed bootstrap sources under src/generated/java_cup are the
        // contract: every file the generators emit (jflex runs first via the
        // task dependency) must be reproduced byte-for-byte. Mismatch means
        // either the grammar changed (regenerate and commit) or the generator
        // regressed.
        def failures = diffGoldenNet('build/generated/java_cup', 'src/generated/java_cup')
        if (!failures.isEmpty()) {
            throw new GradleException(
                'bootstrap sources out of sync with src/generated/java_cup:\n' + failures.join('\n'))
        }
    }
}

tasks.register('generateJFlexLexer', JavaExec) {
    mainClass = 'jflex.Main'
    classpath = configurations.jflex
    args = ['-d', 'build/generated/java_cup', 'src/jflex/Lexer.jflex']
    workingDir = project.projectDir
    // Regeneration output goes to build/generated only (the compiled copy is
    // committed under src/generated). Stale files here would mask the diff in
    // generateCupParser, so wipe them before regenerating; CUP generation runs
    // after this task via its task dependency.
    doFirst {
        delete fileTree(dir: 'build/generated/java_cup', include: '*.java')
    }
}

jar {
    archiveBaseName = 'java-cup-' + project.version
    archiveVersion = ''
    manifest {
        attributes(
                'Main-Class': 'java_cup.Main'
        )
    }
}

tasks.register('runtimeJar', Jar) {
    archiveBaseName = 'java-cup-' + project.version + '-runtime'
    archiveVersion = ''
    dependsOn classes
    from sourceSets.main.output
    include 'java_cup/runtime/**'
}

// The runtime artifact has its own source and Javadoc JARs. The regular
// sourcesJar/javadocJar tasks belong to the complete compiler distribution.
tasks.register('runtimeSourcesJar', Jar) {
    archiveBaseName = 'java-cup-runtime'
    archiveClassifier = 'sources'
    from sourceSets.main.allJava.matching {
        include 'java_cup/runtime/**'
    }
}

tasks.register('runtimeJavadoc', Javadoc) {
    dependsOn classes
    failOnError = false
    destinationDir = layout.buildDirectory.dir('docs/runtime-javadoc').get().asFile
    source = sourceSets.main.allJava.matching {
        include 'java_cup/runtime/**'
    }
    classpath = sourceSets.main.output
    options.addBooleanOption('Xdoclint:none', true)
    options.encoding = 'UTF-8'
}

tasks.register('runtimeJavadocJar', Jar) {
    dependsOn tasks.named('runtimeJavadoc')
    archiveBaseName = 'java-cup-runtime'
    archiveClassifier = 'javadoc'
    from tasks.named('runtimeJavadoc').map { it.destinationDir }
}

tasks.register('testMiniJava', ExecutingTask) {
    dependsOn(jar)

    doFirst {
        // Create directories
        mkdir 'testgrammars/minijava'
        mkdir 'testgrammars/minijava/classes'

        // Clean previous class files
        delete fileTree(dir: 'testgrammars/minijava/classes', include: '*.class')
        delete fileTree(dir: 'testgrammars/minijava', include: '*.java')

        println 'Running minijava test...'
    }

    doLast {
        // Generate lexer using JFlex from Gradle configuration
        execOps.exec {
            commandLine 'java', '-cp', configurations.jflex.asPath, 'jflex.Main',
                        '-d', 'testgrammars/minijava', 'src/test/resources/minijava/minijava.jflex'
            workingDir '.'
        }

        // Generate parser using current project's CUP code
        execOps.exec {
            commandLine 'java', '-cp', files(jar.archiveFile).asPath, 'java_cup.Main',
                        '-interface',
                        '-parser', 'MiniJavaParser',
                        '-symbols', 'MiniJavaSymbols',
                        '-nonterms',
                        '-destdir', 'testgrammars/minijava',
                        '-ast', 'Node%s',
                        'src/test/resources/minijava/minijava.cup'
            workingDir '.'
        }

        // Compile generated Java files
        execOps.exec {
            commandLine 'javac', '-cp', files(runtimeJar.archiveFile, 'testgrammars/minijava').asPath,
                        '-d', 'testgrammars/minijava/classes',
                        'testgrammars/minijava/*.java'
            workingDir '.'
        }

        // Generated parser output must stay byte-stable (REFACTORING.md Phase 1).
        // Lexer.java is the jflex artifact, not a CUP output, so it has no golden.
        def goldenFailures = diffGoldenNet('testgrammars/minijava',
                'src/test/resources/minijava/golden', 'Lexer.java')
        if (!goldenFailures.isEmpty()) {
            throw new GradleException('testMiniJava golden diff failed:\n' + goldenFailures.join('\n'))
        }

        // Run the parser and capture output
        def actualOutput
        try {
            def proc = [
                    "java", "-cp", files(runtimeJar.archiveFile, "testgrammars/minijava/classes").asPath,
                    "MiniJavaParser",
                    "src/test/resources/minijava/simple.minijava"
            ].execute()
            proc.waitFor()
            actualOutput = proc.in.text.trim()
        } catch (Exception e) {
            actualOutput = e.getMessage()
        }

        // Read expected output
        def expectedOutput = new File('src/test/resources/minijava/simple.output').text.trim()

        // Normalize outputs for comparison
        def normalize = { String text ->
            return text.replaceAll("\\r\\n", "\n")
        }

        def normalizedActual = normalize(actualOutput)
        def normalizedExpected = normalize(expectedOutput)

        // Compare outputs
        if (normalizedActual.equals(normalizedExpected)) {
            println '\nTEST RESULT: PASS'
        } else {
            throw new GradleException(
                'testMiniJava FAILED\nExpected:\n' + normalizedExpected +
                '\nActual:\n' + normalizedActual)
        }
    }
}

tasks.register('testAstLocation', ExecutingTask) {
    dependsOn(jar)

    doFirst {
        mkdir 'testgrammars/astloc'
        mkdir 'testgrammars/astloc/classes'

        delete fileTree(dir: 'testgrammars/astloc/classes', include: '*.class')
        delete fileTree(dir: 'testgrammars/astloc', include: '*.java')

        println 'Running AST location test...'
    }

    doLast {
        copy {
            from 'src/test/resources/astloc/scanner.java'
            into 'testgrammars/astloc'
        }

        // Generate parser with the current build of java_cup. The grammar
        // declares `class AstLocParser;` itself, so -parser/-symbols are omitted.
        // The javac step below is also the regression net for generated-code
        // defects: the parser's baked auto actions and the Node*.java classes
        // must agree on every class and factory name (incl. anonymous
        // expressions' NodeEbnf* classes).
        execOps.exec {
            commandLine 'java', '-cp', files(jar.archiveFile).asPath, 'java_cup.Main',
                        '-interface',
                        '-nonterms',
                        '-destdir', 'testgrammars/astloc',
                        '-ast', 'Node%p',
                        'src/test/resources/astloc/astloc.cup'
            workingDir '.'
        }

        execOps.exec {
            commandLine 'javac', '-cp', files(runtimeJar.archiveFile, 'testgrammars/astloc').asPath,
                        '-d', 'testgrammars/astloc/classes',
                        'testgrammars/astloc/*.java'
            workingDir '.'
        }

        def ops = execOps
        def failures = []

        // Generated parser output must stay byte-stable (REFACTORING.md Phase 1).
        // scanner.java is hand-written, not a CUP output, so it has no golden.
        failures.addAll(diffGoldenNet('testgrammars/astloc',
                'src/test/resources/astloc/golden', 'scanner.java'))

        // Grammars under invalid/ MUST be rejected by label validation
        // (non-zero exit + a "Label ..." error on stderr).
        fileTree(dir: 'src/test/resources/astloc/invalid', include: '*.cup')
                .sort { it.name }.each { grammar ->
            def stderr = new ByteArrayOutputStream()
            def result = ops.exec {
                commandLine 'java', '-cp', files(jar.archiveFile).asPath, 'java_cup.Main',
                            '-interface', '-nonterms',
                            '-destdir', 'testgrammars/astloc',
                            '-ast', 'Node%p',
                            grammar.absolutePath
                workingDir '.'
                errorOutput = stderr
                ignoreExitValue = true
            }
            if (result.exitValue == 0 || !stderr.toString().contains('Label "')) {
                failures.add("invalid grammar ${grammar.name} was not rejected " +
                        "(exit=${result.exitValue})\n${stderr.toString().trim()}")
            }
        }

        // Run every case and diff against its .expected file. Non-zero JVM exit
        // (e.g. a ClassCastException while building an empty list node) or any
        // output mismatch fails the build.
        fileTree(dir: 'src/test/resources/astloc/cases', include: '*.input')
                .sort { it.name }.each { input ->
            def expectedFile = new File(input.parentFile, input.name.replace('.input', '.expected'))
            def stdout = new ByteArrayOutputStream()
            def stderr = new ByteArrayOutputStream()
            def result = ops.exec {
                commandLine 'java', '-cp',
                            files(runtimeJar.archiveFile, 'testgrammars/astloc/classes').asPath,
                            'AstLocParser', input.absolutePath
                workingDir '.'
                standardOutput = stdout
                errorOutput = stderr
                ignoreExitValue = true
            }
            def actual = stdout.toString().trim().replaceAll('\r\n', '\n')
            if (result.exitValue != 0) {
                failures.add("case ${input.name} FAILED (exit=${result.exitValue})\n${stderr.toString().trim()}")
            } else if (!expectedFile.exists()) {
                failures.add("case ${input.name} FAILED: missing expected file ${expectedFile.name}\n--- actual ---\n${actual}")
            } else {
                def expected = expectedFile.text.trim().replaceAll('\r\n', '\n')
                if (actual != expected) {
                    failures.add("case ${input.name} FAILED: output mismatch\n" +
                            "--- expected ---\n${expected}\n--- actual ---\n${actual}")
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('testAstLocation failed:\n' + failures.join('\n\n'))
        }
        println '\nTEST RESULT: PASS'
    }
}

jar.finalizedBy runtimeJar

// The strong self-hosting gate: regenerate with the jar built from the
// working tree (NOT the frozen bootstrap jar) and byte-compare against the
// committed sources. A failure means the generator itself regressed -- the
// bootstrap-jar-based generateCupParser cannot catch that on its own.
tasks.register('checkSelfHost', ExecutingTask) {
    dependsOn tasks.named('jar')

    doLast {
        execOps.exec {
            commandLine 'java', '-cp', files(jar.archiveFile).asPath, 'java_cup.Main',
                        '-parser', 'CupParser',
                        '-symbols', 'GrammarSymConstants',
                        '-interface',
                        '-nonterms',
                        '-ast', 'Node%p',
                        '-destdir', 'build/selfhost/java_cup',
                        'src/cup/parser.cup'
            workingDir '.'
        }
        // Lexer.java is the jflex artifact, not a CUP output, so it has no
        // counterpart in this regeneration.
        def failures = diffGoldenNet('build/selfhost/java_cup', 'src/generated/java_cup', 'Lexer.java')
        if (!failures.isEmpty()) {
            throw new GradleException(
                'self-host regeneration diverged from src/generated/java_cup:\n' + failures.join('\n'))
        }
    }
}

tasks.register('testCalc', ExecutingTask) {
    dependsOn(jar)

    doFirst {
        // Create directories
        mkdir 'testgrammars/calc'
        mkdir 'testgrammars/calc/classes'

        // Clean previous class files
        delete fileTree(dir: 'testgrammars/calc/classes', include: '*.class')
        delete fileTree(dir: 'testgrammars/calc', include: '*.java')

        println 'Running calc test...'
    }

    doLast {
        // Copy scanner to test directory
        copy {
            from 'src/test/resources/calc/scanner.java'
            into 'testgrammars/calc'
        }

        // Generate parser using current project's CUP code
        execOps.exec {
            commandLine 'java', '-cp', files(jar.archiveFile).asPath, 'java_cup.Main',
                        '-interface',
                        '-parser', 'CalcParser',
                        '-symbols', 'CalcSymbols',
                        '-destdir', 'testgrammars/calc',
                        'src/test/resources/calc/calc.cup'
            workingDir '.'
        }

        // Compile generated Java files
        execOps.exec {
            commandLine 'javac', '-cp', files(runtimeJar.archiveFile, 'testgrammars/calc').asPath,
                        '-d', 'testgrammars/calc/classes',
                        'testgrammars/calc/*.java'
            workingDir '.'
        }

        // Generated parser output must stay byte-stable (REFACTORING.md Phase 1).
        // scanner.java is hand-written, not a CUP output, so it has no golden.
        def goldenFailures = diffGoldenNet('testgrammars/calc',
                'src/test/resources/calc/golden', 'scanner.java')
        if (!goldenFailures.isEmpty()) {
            throw new GradleException('testCalc golden diff failed:\n' + goldenFailures.join('\n'))
        }

        println 'Calc example compiled successfully. To run:'
        execOps.exec {
            commandLine 'java', '-cp', files(runtimeJar.archiveFile, 'testgrammars/calc/classes').asPath, 'Main'
            workingDir '.'
            standardInput = System.in
        }
    }
}

// Anonymous-expression golden net (non-AST mode): the calc/minijava/astloc
// grammars contain no (A|B) groups, yet the anon lowering paths (hidden
// branch/group NTs, _useRhsCache memo hits, _pushInlineProd injection, the
// implicit $START build firing mid-branch) are the trickiest order-sensitive
// code in the front half. This grammar pins them; it is generated, compiled
// and byte-diffed, never executed.
tasks.register('testAnonGolden', ExecutingTask) {
    dependsOn(jar)

    doFirst {
        mkdir 'testgrammars/anon'
        mkdir 'testgrammars/anon/classes'

        delete fileTree(dir: 'testgrammars/anon/classes', include: '*.class')
        delete fileTree(dir: 'testgrammars/anon', include: '*.java')

        println 'Running anonymous-expression golden test...'
    }

    doLast {
        // Generate parser using current project's CUP code
        execOps.exec {
            commandLine 'java', '-cp', files(jar.archiveFile).asPath, 'java_cup.Main',
                        '-interface',
                        '-parser', 'AnonParser',
                        '-symbols', 'AnonSym',
                        '-destdir', 'testgrammars/anon',
                        'src/test/resources/anon/anon.cup'
            workingDir '.'
        }

        // Compile generated Java files
        execOps.exec {
            commandLine 'javac', '-cp', files(runtimeJar.archiveFile, 'testgrammars/anon').asPath,
                        '-d', 'testgrammars/anon/classes',
                        'testgrammars/anon/*.java'
            workingDir '.'
        }

        def goldenFailures = diffGoldenNet('testgrammars/anon',
                'src/test/resources/anon/golden')
        if (!goldenFailures.isEmpty()) {
            throw new GradleException('testAnonGolden failed:\n' + goldenFailures.join('\n'))
        }
        println '\nTEST RESULT: PASS'
    }
}

artifacts {
    archives jar
    archives runtimeJar
}

def developerId = findProperty('developerId') ?: 'kmar'
def developerName = findProperty('developerName') ?: 'kmar'
def developerEmail = findProperty('developerEmail') ?: ''

def configurePom = { pom, pomName, pomDescription ->
    pom.name = pomName
    pom.description = pomDescription
    pom.url = 'https://github.com/EmptyDreams/cup'

    pom.licenses {
        license {
            name = 'CUP License'
            url = 'https://github.com/EmptyDreams/cup/blob/community/licence.txt'
        }
    }

    pom.developers {
        developer {
            id = developerId
            name = developerName
            if (developerEmail) {
                email = developerEmail
            }
        }
    }

    pom.scm {
        url = 'https://github.com/EmptyDreams/cup/tree/community'
        connection = 'scm:git:git://github.com/EmptyDreams/cup.git'
        developerConnection = 'scm:git:ssh://git@github.com/EmptyDreams/cup.git'
    }
}

publishing {
    publications {
        tool(MavenPublication) {
            groupId = project.group
            artifactId = 'java-cup'
            version = project.version

            artifact tasks.named('jar')
            artifact tasks.named('sourcesJar')
            artifact tasks.named('javadocJar')

            pom {
                configurePom(delegate, 'Java CUP Parser Generator',
                        'CUP parser generator')
            }
        }

        runtime(MavenPublication) {
            groupId = project.group
            artifactId = 'java-cup-runtime'
            version = project.version

            artifact tasks.named('runtimeJar')
            artifact tasks.named('runtimeSourcesJar')
            artifact tasks.named('runtimeJavadocJar')

            pom {
                configurePom(delegate, 'Java CUP Runtime',
                        'Runtime library for parsers generated by Java CUP')
            }
        }
    }

    repositories {
        maven {
            name = 'jreleaserStaging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

// JReleaser signs the staged publications, creates checksums, and submits
// them to the Central Publisher Portal. Credentials are read from environment
// variables or ~/.jreleaser/config.toml and are never stored in this project.
jreleaser {
    signing {
        pgp {
            active = 'RELEASE'
            armored = true
        }
    }

    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                }
            }
        }
    }

    release {
        github {
            enabled = true
            repoOwner = 'EmptyDreams'
            name = 'cup'
        }
    }
}

tasks.withType(AbstractJReleaserTask).configureEach {
    doNotTrackState('JReleaser manages trace.log and conflicts with Gradle output cleanup on Windows')
}